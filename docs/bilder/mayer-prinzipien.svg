<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-label="Im Labor wirken fast alle Gestaltungsregeln stärker als im Durchschnitt" font-family="Lexend, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13">
<title>Im Labor wirken fast alle Gestaltungsregeln stärker als im Durchschnitt</title>
<rect width="760" height="490" rx="12" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1a2130">Im Labor wirken fast alle Gestaltungsregeln stärker als im Durchschnitt</text>
